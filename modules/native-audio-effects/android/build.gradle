apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace "com.anonymous.nativeaudioeffects"
  compileSdkVersion 36

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    abortOnError false
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
}
